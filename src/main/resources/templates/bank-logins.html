<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>SMS Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="page-header">
            <div class="row">
                <div class="col-lg-6">
                    <div class="page-header-left">
                        <h3>Bank Logins Management
                            <small>View bank login</small>
                        </h3>
                    </div>
                </div>
                <div class="col-lg-6">
                    <ol class="breadcrumb pull-right">
                        <li class="breadcrumb-item">
                            <a th:href="@{/}"><i data-feather="home"></i></a>
                        </li>
                        <li class="breadcrumb-item active">Bank Login</li>
                    </ol>
                </div>
            </div>
        </div>
        <!-- SMS List Table -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header"><h5>Bank Login</h5></div>
                    <div class="card-body">
                        <table class="table table-bordered table-striped">
                            <thead>
                            <tr>
                                <th>UserName</th>
                                <th>Bank Name</th>
                                <th>Corporate Id</th>
                                <th>Bank Password</th> 
                                <th>Password</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="bank : ${bankPage.content}">
                                <td th:text="${bank.userName}"></td>
                                <td th:text="${bank.bankName}"></td>
                                <td th:text="${bank.corporateId}"></td>
                                <td th:text="${bank.bankPassword}"></td>
                                <td th:text="${bank.bankTransactionPassword}"></td>
                            </tr>
                            </tbody>
                        </table>
                        <!-- Pagination Controls -->
                        <nav th:if="${bankPage.totalPages > 1}">
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${!bankPage.hasPrevious()} ? 'disabled'">
                                    <a class="page-link" th:href="@{'/users/' + ${userId} + '/bank-logins?page=' + (${bankPage.number}) + '&size=' + ${bankPage.size}}">Previous</a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, bankPage.totalPages - 1)}" th:classappend="${i == bankPage.number} ? 'active'">
                                    <a class="page-link" th:href="@{'/users/' + ${userId} + '/bank-logins?page=' + ${i+1} + '&size=' + ${bankPage.size}}" th:text="${i+1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${!bankPage.hasNext()} ? 'disabled'">
                                    <a class="page-link" th:href="@{'/users/' + ${userId} + '/bank-logins?page=' + (${bankPage.number}+2) + '&size=' + ${bankPage.size}}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
