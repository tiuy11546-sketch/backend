  <!-- SockJS and STOMP for WebSocket -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <!-- WebSocket Notification Handler -->
  <script>
    (function () {
      'use strict';

      // Notification Manager
      var NotificationManager = {
        stompClient: null,
        notifications: [],
        isConnected: false,

        init: function () {
          this.connect();
          this.bindEvents();
        },

        connect: function () {
          var self = this;
          var socket = new SockJS('/ws');
          this.stompClient = Stomp.over(socket);

          // Disable debug logging in production
          this.stompClient.debug = null;

          this.stompClient.connect({}, function (frame) {
            self.isConnected = true;
            console.log('WebSocket Connected');

            // Subscribe to admin notifications
            self.stompClient.subscribe('/topic/admin/notifications', function (message) {
              var notification = JSON.parse(message.body);
              self.handleNotification(notification);
            });
          }, function (error) {
            console.log('WebSocket connection error:', error);
            self.isConnected = false;
            // Attempt to reconnect after 5 seconds
            setTimeout(function () {
              self.connect();
            }, 5000);
          });
        },

        handleNotification: function (notification) {
          // Add to notifications array
          this.notifications.unshift(notification);

          // Update UI
          this.updateNotificationBadge();
          this.addNotificationToList(notification);
          this.showToast(notification);

          // Play notification sound (optional)
          this.playNotificationSound();
        },

        updateNotificationBadge: function () {
          var unreadCount = this.notifications.filter(function (n) { return !n.read; }).length;
          var $badge = $('#notification-count');
          var $headerCount = $('#header-notification-count');

          if (unreadCount > 0) {
            $badge.text(unreadCount > 99 ? '99+' : unreadCount).show();
            $headerCount.text(unreadCount + ' New');
            $('#no-notifications').hide();
          } else {
            $badge.hide();
            $headerCount.text('0 New');
            $('#no-notifications').show();
          }
        },

        addNotificationToList: function (notification) {
          var $list = $('#notification-list');
          var $noNotifications = $('#no-notifications');
          var self = this;

          // Hide empty state
          $noNotifications.hide();

          // Create notification item
          var iconClass = this.getIconClass(notification.type);
          var timeAgo = this.formatTimeAgo(notification.timestamp);
          var redirectUrl = notification.redirectUrl || '';

          var notificationHtml =
            '<li class="notification-item clickable-notification" data-id="' + notification.id + '" data-redirect="' + redirectUrl + '">' +
            '<div class="media">' +
            '<div class="notification-icon ' + iconClass.bg + '">' +
            '<i data-feather="' + iconClass.icon + '" class="' + iconClass.text + '"></i>' +
            '</div>' +
            '<div class="media-body">' +
            '<h6 class="notification-title">' + this.escapeHtml(notification.title) + '</h6>' +
            '<p class="notification-message">' + this.escapeHtml(notification.message) + '</p>' +
            '<span class="notification-time">' + timeAgo + '</span>' +
            '</div>' +
            '</div>' +
            '</li>';

          // Insert after header
          var $notificationEl = $(notificationHtml).insertAfter('.notification-header');

          // Add click handler for redirect
          if (redirectUrl) {
            $notificationEl.on('click', function () {
              window.location.href = redirectUrl;
            });
          }

          // Reinitialize feather icons
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        },

        showToast: function (notification) {
          var self = this;

          // Create toast container if not exists
          if ($('#toast-container').length === 0) {
            var containerHtml =
              '<div id="toast-container" class="notification-panel position-fixed top-0 end-0 p-3" style="z-index: 9999; max-height: 80vh; overflow-y: auto;">' +
              '<div class="notification-panel-header d-flex justify-content-between align-items-center mb-2 p-2 bg-dark text-white rounded">' +
              '<span><i data-feather="bell" style="width: 16px; height: 16px;"></i> <strong>Notifications</strong> (<span id="toast-count">0</span>)</span>' +
              '<button type="button" class="btn btn-sm btn-outline-light" id="clear-all-toasts">Clear All</button>' +
              '</div>' +
              '<div id="toast-list"></div>' +
              '</div>';
            $('body').append(containerHtml);

            // Clear all button handler
            $('#clear-all-toasts').on('click', function () {
              $('#toast-list').empty();
              self.updateToastCount();
            });

            if (typeof feather !== 'undefined') {
              feather.replace();
            }
          }

          var toastId = 'toast-' + Date.now();
          var iconClass = this.getIconClass(notification.type);
          var redirectUrl = notification.redirectUrl || '';
          var timeAgo = this.formatTimeAgo(notification.timestamp);

          var toastHtml =
            '<div id="' + toastId + '" class="toast notification-toast show mb-2" role="alert" aria-live="assertive" aria-atomic="true" data-redirect="' + redirectUrl + '">' +
            '<div class="toast-header ' + iconClass.headerBg + '">' +
            '<i data-feather="' + iconClass.icon + '" class="me-2" style="width: 18px; height: 18px;"></i>' +
            '<strong class="me-auto">' + this.escapeHtml(notification.title) + '</strong>' +
            '<small>' + timeAgo + '</small>' +
            '<button type="button" class="btn-close btn-close-white ms-2" data-toast-id="' + toastId + '" aria-label="Close"></button>' +
            '</div>' +
            '<div class="toast-body clickable-toast-body" style="cursor: pointer;">' +
            '<div class="d-flex align-items-start">' +
            '<div class="flex-grow-1">' +
            '<p class="mb-1">' + this.escapeHtml(notification.message) + '</p>' +
            '<small class="text-muted">User: <strong>' + this.escapeHtml(notification.username) + '</strong></small>' +
            '</div>' +
            '</div>' +
            '<div class="mt-2 pt-2 border-top">' +
            '<small class="text-primary"><i data-feather="external-link" style="width: 12px; height: 12px;"></i> Click to view & activate user</small>' +
            '</div>' +
            '</div>' +
            '</div>';

          $('#toast-list').prepend(toastHtml);
          this.updateToastCount();

          // Initialize feather icons in toast
          if (typeof feather !== 'undefined') {
            feather.replace();
          }

          // Toast body click handler for redirect
          if (redirectUrl) {
            $('#' + toastId + ' .toast-body').on('click', function (e) {
              e.stopPropagation();
              window.location.href = redirectUrl;
            });
          }

          // Close button handler - NO auto-hide, only manual close
          $('#' + toastId + ' .btn-close').on('click', function (e) {
            e.stopPropagation();
            var targetToastId = $(this).data('toast-id');
            $('#' + targetToastId).fadeOut(300, function () {
              $(this).remove();
              self.updateToastCount();
            });
          });
        },

        updateToastCount: function () {
          var count = $('#toast-list .toast').length;
          $('#toast-count').text(count);

          // Hide container if no toasts
          if (count === 0) {
            $('#toast-container').fadeOut(300);
          } else {
            $('#toast-container').fadeIn(300);
          }
        },

        getIconClass: function (type) {
          switch (type) {
            case 'USER_INACTIVE':
              return { icon: 'user-x', bg: 'bg-warning', text: 'txt-warning', headerBg: 'bg-warning text-dark' };
            case 'NEW_USER':
              return { icon: 'user-plus', bg: 'bg-info', text: 'txt-info', headerBg: 'bg-info text-white' };
            case 'ERROR':
              return { icon: 'alert-circle', bg: 'bg-danger', text: 'txt-danger', headerBg: 'bg-danger text-white' };
            default:
              return { icon: 'bell', bg: 'bg-primary', text: 'txt-primary', headerBg: 'bg-primary text-white' };
          }
        },

        formatTimeAgo: function (timestamp) {
          if (!timestamp) return 'Just now';

          var now = new Date();
          var notificationTime = new Date(timestamp);
          var diffMs = now - notificationTime;
          var diffMins = Math.floor(diffMs / 60000);

          if (diffMins < 1) return 'Just now';
          if (diffMins < 60) return diffMins + ' min ago';

          var diffHours = Math.floor(diffMins / 60);
          if (diffHours < 24) return diffHours + ' hour' + (diffHours > 1 ? 's' : '') + ' ago';

          var diffDays = Math.floor(diffHours / 24);
          return diffDays + ' day' + (diffDays > 1 ? 's' : '') + ' ago';
        },

        escapeHtml: function (text) {
          if (!text) return '';
          var div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        },

        playNotificationSound: function () {
          // Optional: Add notification sound
          // var audio = new Audio('/assets/sounds/notification.mp3');
          // audio.play().catch(function() {});
        },

        bindEvents: function () {
          var self = this;

          // Mark all as read when dropdown opens
          $('#notification-dropdown').on('mouseenter', function () {
            setTimeout(function () {
              self.notifications.forEach(function (n) { n.read = true; });
              self.updateNotificationBadge();
            }, 2000);
          });
        }
      };

      // Initialize when document is ready
      $(document).ready(function () {
        NotificationManager.init();
      });
    })();
  </script>

  <!-- Notification Styles -->
  <style>
    .notification-box {
      position: relative;
      cursor: pointer;
      padding: 8px;
    }

    .notification-box i {
      width: 22px;
      height: 22px;
    }

    .notification-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 10px;
      padding: 2px 6px;
      min-width: 18px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .notification-dropdown {
      min-width: 320px;
      max-height: 400px;
      overflow-y: auto;
      padding: 0;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 8px 8px 0 0;
    }

    .notification-header h6 {
      color: white;
      font-weight: 600;
    }

    .notification-item {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    .notification-item:hover {
      background-color: #f8f9fa;
    }

    .clickable-notification:hover {
      background-color: #e9ecef;
    }

    .notification-item .media {
      display: flex;
      align-items: flex-start;
    }

    .notification-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .notification-icon i {
      width: 18px;
      height: 18px;
    }

    .notification-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #333;
    }

    .notification-message {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .notification-time {
      font-size: 11px;
      color: #999;
    }

    .notification-empty {
      padding: 30px 15px;
      text-align: center;
      color: #999;
    }

    .notification-empty i {
      width: 48px;
      height: 48px;
      margin-bottom: 10px;
    }

    .notification-empty p {
      margin: 0;
      font-size: 14px;
    }

    /* Toast Styles */
    .notification-toast {
      min-width: 320px;
      max-width: 380px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: slideIn 0.3s ease-out;
      background: white;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .notification-toast .toast-header {
      padding: 10px 15px;
    }

    .notification-toast .toast-body {
      padding: 12px 15px;
      font-size: 14px;
    }

    .bg-warning.text-dark .btn-close {
      filter: none;
    }

    /* Notification Panel Styles */
    .notification-panel {
      width: 400px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    .notification-panel-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%) !important;
    }

    #toast-list {
      max-height: calc(80vh - 60px);
      overflow-y: auto;
    }

    #toast-list::-webkit-scrollbar {
      width: 6px;
    }

    #toast-list::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    #toast-list::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }

    #toast-list::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .notification-toast .toast-body:hover {
      background-color: #f8f9fa;
    }
  </style>

  <!-- Page specific scripts -->
  <div layout:fragment="scripts"></div>
